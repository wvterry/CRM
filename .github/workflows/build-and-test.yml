name: Build and Test Spring Boot App

on:
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build CRM
        run: mvn -B clean package -pl crm -am -DskipTests

      - name: Build User Service
        run: mvn -B clean package -pl user-service -am -DskipTests

      - name: Run tests
        run: mvn test
